name: Compilar para Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Esto te permite activar la compilación manualmente desde la web

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar herramientas de compilación C++
        uses: ilammy/msvc-dev-cmd@v1

      - name: Instalar y compilar dependencias GTK4/WebKit
        run: |
          pip install gvsbuild
          # Compilamos las librerías nativas que usa tu navegador
          gvsbuild build gtk4 libsoup webkit6
        shell: pwsh

      - name: Compilar Navegador
        run: |
          # Agregamos las librerías compiladas al PATH para que Cargo las vea
          $env:Path += ";C:\gvsbuild\release\bin"
          $env:PKG_CONFIG_PATH = "C:\gvsbuild\release\lib\pkgconfig"
          cargo build --release --target x86_64-pc-windows-msvc
        shell: pwsh

      - name: Guardar el archivo .exe como resultado
        uses: actions/upload-artifact@v4
        with:
          name: axysbrowser-windows
          path: target/x86_64-pc-windows-msvc/release/axysbrowser.exe
